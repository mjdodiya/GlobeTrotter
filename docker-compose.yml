services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_USER: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
